[project]
name = "marisa-assistant"
version = "0.1.0"
description = "Assistente pessoal de produtividade acadêmica e gestão financeira."
requires-python = ">=3.12,<3.13"
dependencies = [
    "caldav>=1.3.9",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "supabase>=2.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "work", "outputs"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = "^(\\.venv|work|outputs)/"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
